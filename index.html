<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#176b43"><meta name="description" content="Hockey Coach Planner – opstellingen, wissels en speeltijd">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Hockey Coach Planner</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f7f4;color:#13251c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{border:0;border-radius:12px;padding:11px 13px;font-weight:750}button.primary{background:#176b43;color:#fff}button.soft{background:#e4f2e9;color:#176b43}button.gray{background:#e9eeeb}.app{max-width:1050px;margin:auto;min-height:100vh;padding-bottom:75px}.top{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #dce6df;padding:14px 16px}.brand{font-size:20px;font-weight:900}.sub{font-size:12px;color:#718078}main{padding:14px}.screen{display:none}.screen.on{display:block}.card{background:#fff;border:1px solid #dce6df;border-radius:17px;padding:14px;margin-bottom:12px}h2,h3{margin:0 0 12px}.row{display:flex;gap:8px;align-items:center}.between{justify-content:space-between}input,select{width:100%;border:1px solid #cfdcd4;border-radius:10px;padding:10px;background:#fff}.players{display:grid;grid-template-columns:1fr 1fr;gap:8px}.player{display:flex;justify-content:space-between;align-items:center;background:#f7faf8;border-radius:12px;padding:8px}.num{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#176b43;color:#fff;margin-right:7px;font-size:12px;font-weight:800}.badge{font-size:11px;padding:5px 8px;border-radius:999px;background:#e4f2e9;color:#176b43;font-weight:800}.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:12px}.tabs button{white-space:nowrap;background:#e9eeeb}.tabs button.sel{background:#176b43;color:#fff}.hockey-field{position:relative;width:100%;aspect-ratio:91.4/55;background:#2e8c4b;border:4px solid white;border-radius:5px;overflow:hidden;touch-action:none}.fline{position:absolute;background:#fff;z-index:1}.center{left:50%;top:0;bottom:0;width:2px}.q{left:27.35%;top:0;bottom:0;width:2px}.q.r{left:auto;right:27.35%}.cc{position:absolute;width:25%;aspect-ratio:1;left:50%;top:50%;transform:translate(-50%,-50%);border:2px solid #fff;border-radius:50%}.d{position:absolute;top:50%;width:22%;height:72%;transform:translateY(-50%);border:2px solid #fff;border-radius:50%}.d.l{left:-10%}.d.r{right:-10%}.goal{position:absolute;top:50%;width:4.5%;height:18%;transform:translateY(-50%);border:3px solid white;background:#eee}.goal.l{left:-4.5%;border-left:0}.goal.r{right:-4.5%;border-right:0}.fp{position:absolute;z-index:5;width:46px;height:46px;transform:translate(-50%,-50%);border:2px solid white;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-weight:900;font-size:12px;box-shadow:0 3px 9px #0005;touch-action:none}.gk{background:#d59b00}.out{background:#1769aa}.subgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{padding:8px 10px;border:1px solid #ccd8d1;border-radius:999px;background:white}.chip.sel{outline:3px solid #b7d8c4}.timer{text-align:center;font-size:48px;font-weight:950}.quarter{text-align:center;color:#718078;font-weight:800}.next{background:#e4f2e9;border-radius:12px;padding:12px;margin:12px 0}.log{font-size:13px;line-height:1.6;margin-top:12px}.bar{height:8px;background:#e5ebe7;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#176b43}.bottom{position:fixed;left:0;right:0;bottom:0;height:70px;background:#fff;border-top:1px solid #dce6df;display:flex;z-index:20}.bottom button{flex:1;border-radius:0;background:#fff;color:#718078}.bottom button.sel{color:#176b43}.empty{text-align:center;color:#718078;padding:18px}@media(min-width:800px){.bottom{position:static}.bottom button{max-width:240px}.players{grid-template-columns:1fr 1fr 1fr}}@media(max-width:560px){.players,.subgrid{grid-template-columns:1fr}.fp{width:40px;height:40px;font-size:10px}}
</style></head>
<body><div class="app">
<header class="top"><div class="brand">🏑 Hockey Coach Planner</div><div class="sub">Opstelling · echte wissels · speeltijd</div></header>
<main>
<section id="home" class="screen on"><div class="card"><div class="row between"><div><h2>Wedstrijden</h2><div class="sub">Je gegevens worden lokaal op je telefoon opgeslagen.</div></div><button class="primary" onclick="newMatch()">＋ Nieuwe wedstrijd</button></div></div><div id="matches"></div></section>
<section id="team" class="screen"><div class="card"><h2>Mijn team</h2><div class="row"><input id="pn" placeholder="Naam speler"><input id="pno" placeholder="#" inputmode="numeric" style="max-width:70px"><button class="primary" onclick="addPlayer()">＋</button></div></div><div class="card"><div id="plist" class="players"></div></div></section>
<section id="game" class="screen"><div class="card"><div class="row between"><div><h2 id="gameTitle"></h2><div id="gameMeta" class="sub"></div></div><span id="status" class="badge"></span></div></div>
<div class="tabs"><button id="tLive" class="sel" onclick="tab('live')">⏱ Live</button><button id="tLine" onclick="tab('line')">🏑 Opstelling</button><button id="tSubs" onclick="tab('subs')">🔄 Wissels</button><button id="tTime" onclick="tab('time')">📊 Speeltijd</button></div>
<div id="live"></div><div id="line" style="display:none"></div><div id="subs" style="display:none"></div><div id="time" style="display:none"></div></section>
</main><nav class="bottom"><button class="sel" onclick="go('home',this)">🏠<br>Wedstrijden</button><button onclick="go('team',this)">👥<br>Team</button></nav></div>
<script>
const KEY="hcp_pwa_v1";let D=JSON.parse(localStorage.getItem(KEY)||"null")||{players:[],matches:[],current:null},timer=null;
const POS={"4-3-3":[[7,50],[20,15],[20,38],[20,62],[20,85],[43,25],[43,50],[43,75],[67,25],[67,50],[67,75]],"4-3-4":[[7,50],[20,15],[20,38],[20,62],[20,85],[43,25],[43,50],[43,75],[67,15],[67,38],[67,62]],"4-4-2":[[7,50],[20,15],[20,38],[20,62],[20,85],[43,15],[43,38],[43,62],[43,85],[68,35],[68,65]],"3-4-3":[[7,50],[22,22],[22,50],[22,78],[43,15],[43,38],[43,62],[43,85],[68,25],[68,50],[68,75]]};
const save=()=>localStorage.setItem(KEY,JSON.stringify(D)), M=()=>D.matches.find(x=>x.id===D.current), P=id=>D.players.find(x=>x.id===id);
function go(id,b){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("on"));document.getElementById(id).classList.add("on");document.querySelectorAll(".bottom button").forEach(x=>x.classList.remove("sel"));if(b)b.classList.add("sel");if(id==="home")renderMatches();if(id==="team")renderTeam()}
function newMatch(){let o=prompt("Tegenstander?","");if(!o)return;let ids=D.players.map(x=>x.id),m={id:Date.now(),opp:o,date:new Date().toLocaleDateString("nl-NL"),formation:"4-3-3",q:1,sec:0,running:false,on:ids.slice(0,11),off:ids.slice(11),freq:1,events:[],minutes:Object.fromEntries(ids.map(x=>[x,0]))};D.matches.unshift(m);D.current=m.id;save();openGame()}
function openGame(id=D.current){D.current=id;save();go("game");renderGame()}
function renderMatches(){matches.innerHTML=D.matches.length?D.matches.map(m=>`<div class="card" onclick="openGame(${m.id})"><div class="row between"><b>🆚 ${esc(m.opp)}</b><span class="badge">${m.formation}</span></div><div class="sub">${m.date} · Kwart ${m.q}</div></div>`).join(""):'<div class="card empty">Maak je eerste wedstrijd.</div>'}
function renderTeam(){plist.innerHTML=D.players.length?D.players.map((p,i)=>`<div class="player"><span><span class="num">${p.number||i+1}</span><b>${esc(p.name)}</b></span><button onclick="delP(${p.id})">×</button></div>`).join(""):'<div class="empty">Voeg je spelers toe.</div>'}
function addPlayer(){let n=pn.value.trim();if(!n)return;D.players.push({id:Date.now()+Math.random(),name:n,number:pno.value.trim()});pn.value="";pno.value="";save();renderTeam()}
function delP(id){D.players=D.players.filter(p=>p.id!==id);D.matches.forEach(m=>{m.on=m.on.filter(x=>x!==id);m.off=m.off.filter(x=>x!==id);delete m.minutes[id]});save();renderTeam()}
function esc(s){return String(s).replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[x]))}
function fmt(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(Math.floor(s%60)).padStart(2,"0")}
function renderGame(){let m=M();gameTitle.textContent="🆚 "+m.opp;gameMeta.textContent=m.date+" · 4 kwarten · "+m.formation;status.textContent=m.running?"LIVE":"KWART "+m.q;renderLive();renderLine();renderSubs();renderTime()}
function renderLive(){let m=M(),n=m.events.filter(e=>e.q===m.q).length;live.innerHTML=`<div class="card"><div class="quarter">KWART ${m.q} VAN 4</div><div class="timer">${fmt(m.sec)}</div><div class="row" style="justify-content:center"><button class="${m.running?'gray':'primary'}" onclick="toggle()">${m.running?'Ⅱ Pauzeren':'▶ Start'}</button><button class="gray" onclick="nextQ()">Volgend kwart</button></div><div class="next"><b>${m.freq}× wisselen per kwart</b><div class="sub">${m.freq===2?'Plan: rond 1/3 en 2/3 van het kwart.':'Plan: rond halverwege het kwart.'} Uitgevoerd: ${n}/${m.freq}</div></div><button class="soft" style="width:100%" onclick="tab('subs')">🔄 Wisselen</button></div>`}
function toggle(){let m=M();m.running=!m.running;m.last=Date.now();clearInterval(timer);if(m.running)timer=setInterval(()=>{let now=Date.now(),dt=Math.min(2,(now-m.last)/1000);m.last=now;m.sec+=dt;m.on.forEach(id=>m.minutes[id]=(m.minutes[id]||0)+dt/60);save();renderLive();renderTime()},1000);save();renderGame()}
function nextQ(){let m=M();m.running=false;clearInterval(timer);if(m.q<4){m.q++;m.sec=0}save();renderGame();tab('live')}
function tab(t){["live","line","subs","time"].forEach(x=>{document.getElementById(x).style.display=x===t?"block":"none";document.getElementById("t"+x[0].toUpperCase()+x.slice(1)).classList.toggle("sel",x===t)})}
function renderLine(){let m=M();line.innerHTML=`<div class="card"><h3>Formatie</h3><select onchange="M().formation=this.value;save();renderGame()">${Object.keys(POS).map(x=>`<option ${x===m.formation?'selected':''}>${x}</option>`).join("")}</select></div><div class="card"><div class="hockey-field" id="field"><div class="fline center"></div><div class="fline q"></div><div class="fline q r"></div><div class="cc"></div><div class="d l"></div><div class="d r"></div><div class="goal l"></div><div class="goal r"></div><div id="fps"></div></div><div class="sub">Sleep spelers om hun positie te wijzigen.</div></div>`;renderField()}
function renderField(){let m=M(),l=document.getElementById("fps");if(!l)return;l.innerHTML="";let p=POS[m.formation];m.on.slice(0,11).forEach((id,i)=>{let x=P(id),e=document.createElement("div");e.className="fp "+(i===0?"gk":"out");e.textContent=x?.number||(i===0?"GK":i+1);e.style.left=p[i][0]+"%";e.style.top=p[i][1]+"%";e.onclick=()=>{selOn=i;tab("subs");renderSubs()};e.onpointerdown=drag;l.appendChild(e)})}
function drag(ev){let e=ev.currentTarget,f=document.getElementById("field");const mv=x=>{let r=f.getBoundingClientRect();e.style.left=Math.max(3,Math.min(97,(x.clientX-r.left)/r.width*100))+"%";e.style.top=Math.max(5,Math.min(95,(x.clientY-r.top)/r.height*100))+"%"};const up=()=>{f.removeEventListener("pointermove",mv);f.removeEventListener("pointerup",up)};f.addEventListener("pointermove",mv);f.addEventListener("pointerup",up)}
let selOn=null,selOff=null;
function renderSubs(){let m=M();subs.innerHTML=`<div class="card"><h3>Wisselfrequentie</h3><div class="row"><button class="${m.freq===1?'primary':'gray'}" onclick="freq(1)">1× per kwart</button><button class="${m.freq===2?'primary':'gray'}" onclick="freq(2)">2× per kwart</button></div></div><div class="card"><h3>Spelers</h3><div class="subgrid"><div><b>Op het veld</b><div id="on" class="chips"></div></div><div><b>Wisselbank</b><div id="off" class="chips"></div></div></div><div class="row" style="margin-top:12px"><button class="primary" onclick="swap()">Wisselen</button><button class="gray" onclick="undo()">↩ Terug</button></div><div class="log">${m.events.length?m.events.slice().reverse().map(e=>`Q${e.q} · ${e.time} — ${esc(P(e.out)?.name||'?')} eruit → ${esc(P(e.in)?.name||'?')} erin`).join("<br>"):"Nog geen wissels."}</div></div>`;m.on.forEach((id,i)=>chip(document.getElementById("on"),id,"on",i));m.off.forEach((id,i)=>chip(document.getElementById("off"),id,"off",i))}
function chip(par,id,t,i){let b=document.createElement("button");b.className="chip "+((t==="on"&&selOn===i)||(t==="off"&&selOff===i)?"sel":"");b.textContent=(P(id)?.number?"#"+P(id).number+" ":"")+P(id)?.name;b.onclick=()=>{if(t==="on"){selOn=i;selOff=null}else{selOff=i;selOn=null}renderSubs()};par.appendChild(b)}
function freq(v){M().freq=v;save();renderSubs()}
function swap(){let m=M();if(selOn===null||selOff===null){alert("Selecteer één speler op het veld en één op de bank.");return}let out=m.on[selOn],inn=m.off[selOff];m.on[selOn]=inn;m.off[selOff]=out;m.events.push({q:m.q,time:new Date().toLocaleTimeString("nl-NL",{hour:"2-digit",minute:"2-digit"}),out,in:inn});selOn=selOff=null;save();renderGame();tab("subs")}
function undo(){let m=M(),e=m.events.pop();if(!e)return;let oi=m.on.indexOf(e.in),ii=m.off.indexOf(e.out);if(oi>=0&&ii>=0){m.on[oi]=m.off[ii];m.off[ii]=e.in}save();renderGame();tab("subs")}
function renderTime(){let m=M();time.innerHTML=`<div class="card"><h3>Speeltijd</h3>${D.players.map(p=>{let x=m.minutes[p.id]||0;return `<div style="margin:12px 0"><div class="row between"><b>${esc(p.name)}</b><span class="sub">${x.toFixed(1)} min</span></div><div class="bar"><i style="width:${Math.min(100,x/40*100)}%"></i></div></div>`}).join("")}</div>`}
renderMatches();renderTeam();
if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"));
</script></body></html>
